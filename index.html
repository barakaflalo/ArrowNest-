<style>
:root{--bg:#140e09;--card:#21170f;--card2:#2c2015;--gold:#e2a93b;--gold2:#ffd77a;--txt:#f6eedc;--mut:#b3a48a;--red:#e04545;--ok:#5fcf7f;--wood:#6a4325}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,12,6,.15),rgba(20,12,6,.86) 62%);touch-action:pan-y}

.wrap{width:100%;max-width:760px}
.logo{margin:6px 0 2px;text-align:center}

.logo h1 span{color:#fff}
.logo .heb{font-size:clamp(18px,3.4vw,24px);font-weight:900;color:#fff;text-shadow:0 2px 6px #000;margin-top:-2px}

.modes{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin:14px 0}
#playDaily.done{opacity:.7}
#kcbar{position:fixed;left:0;right:0;top:0;display:none;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 18px 10px;pointer-events:none;font-weight:800;letter-spacing:2px;color:var(--gold2);direction:ltr;z-index:30;text-shadow:0 2px 4px #000}

#kcbar:before,#kcbar:after{content:"";position:fixed;left:0;right:0;height:8vh;background:#000;z-index:-1}#kcbar:before{top:0}#kcbar:after{bottom:0}
#kcTap{position:fixed;inset:0;z-index:29;display:none}#kcTap.on{display:block}
body.kc #hud{opacity:0;pointer-events:none}
.mcard.ach.lock{opacity:.6}
@media (max-width:720px){.modes{grid-template-columns:1fr 1fr}.modes .big{grid-column:1/-1}}
.mode{position:relative;text-align:start;background:rgba(33,23,15,.9);border:2px solid rgba(226,169,59,.7);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s;box-shadow:0 6px 18px rgba(0,0,0,.4)}

.mode .ic{font-size:42px;line-height:1}

.homebar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.btn{background:rgba(20,14,9,.7);border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:11px 18px;font-weight:700;min-height:44px}

.badge{margin-top:14px;text-align:center;color:var(--mut);font-size:11px}

.cash{display:inline-flex;align-items:center;gap:6px;background:rgba(20,14,9,.85);border:1px solid var(--gold);border-radius:20px;padding:4px 12px;color:var(--gold2);font-weight:800;margin:8px 4px 0}
.head{display:flex;align-items:center;gap:10px;width:100%;max-width:760px;margin-bottom:10px}
.head h2{margin:0;font-size:20px;color:var(--gold2);text-shadow:0 1px 4px #000}
.bk{background:rgba(20,14,9,.8);border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:8px 14px;font-weight:700;min-height:42px}

.seg{display:flex;flex-wrap:wrap;gap:6px}

.note{margin:8px 0 0;color:var(--mut);font-size:12px;line-height:1.4}

.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1}

.links{display:grid;gap:8px;margin-bottom:12px}

.aboutLogo{text-align:center;margin:4px 0 10px}.aboutLogo div{font-size:46px}.aboutLogo b{display:block;color:var(--gold2);font-size:22px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.mcard{position:relative;text-align:start;background:rgba(33,23,15,.92);border:2px solid rgba(226,169,59,.6);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;min-height:100px}
.mcard:active{transform:scale(.98)}
.mcard .ic{font-size:40px}.mcard b{display:block;color:var(--gold2);font-size:17px}.mcard small{display:block;font-size:12px;opacity:.88;line-height:1.35;margin-top:2px}
.mcard .st{color:var(--gold);letter-spacing:2px;font-size:16px;margin-top:4px}.mcard .bst{color:var(--mut);font-size:12px;margin-top:2px}
.mcard .num{position:absolute;top:8px;inset-inline-end:10px;color:var(--mut);font-size:12px;font-weight:800}
.mcard.lock{opacity:.55;border-color:#4a3a28}.mcard.lock .st{color:var(--mut);letter-spacing:0;font-size:12px}

/* HUD */
#hud{position:fixed;inset:0;display:none;pointer-events:none;direction:ltr}
#hud.on{display:block}
#hud .top{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(20,14,9,.74);border:1px solid rgba(226,169,59,.5);border-radius:12px;padding:6px 10px;font-size:14px;font-weight:800;color:var(--txt);min-height:38px;display:flex;align-items:center;gap:6px}
.pill .k{color:var(--mut);font-weight:600;font-size:12px}
#bPause{pointer-events:auto;width:44px;justify-content:center;font-size:16px}
#gatePill{min-width:150px}
#gateTrack{position:relative;flex:1;min-width:80px;height:12px;border-radius:6px;background:#3a2a1c;overflow:hidden;border:1px solid #6b5236}
#gateBar{height:100%;width:100%;background:linear-gradient(90deg,#5fcf7f,#9be08a);transition:width .25s}
#gateBar.mid{background:linear-gradient(90deg,#e6b43c,#f3d06a)}#gateBar.low{background:linear-gradient(90deg,#e04545,#ff7a5a)}
#gatePill.hit{animation:hitp .35s}
@keyframes hitp{0%{border-color:#ff5a4a;background:rgba(120,20,10,.85)}100%{}}
.rb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(226,169,59,.85);background:rgba(20,14,9,.6);color:var(--txt);display:flex;align-items:center;justify-content:center;font-weight:900;touch-action:none}
#bFire{right:max(22px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:104px;height:104px;font-size:17px;flex-direction:column;gap:2px;--p:1;background:radial-gradient(circle at 50% 40%,rgba(140,80,25,.95) 0 55%,transparent 56%),conic-gradient(#ffd77a calc(var(--p)*360deg),rgba(40,28,18,.9) 0);border-color:#ffd77a}
#bFire small{font-size:10px;font-weight:600;opacity:.8}
#bFire.drawing{transform:scale(.95);border-color:#fff}
#hud.lefty #bFire{right:auto;left:max(22px,env(safe-area-inset-left))}
#bZoom{left:max(22px,env(safe-area-inset-left));bottom:max(170px,calc(env(safe-area-inset-bottom) + 170px));width:60px;height:60px;font-size:26px}

#bRock{display:none;right:max(22px,env(safe-area-inset-right));bottom:max(140px,calc(env(safe-area-inset-bottom) + 140px));width:84px;height:84px;font-size:30px;flex-direction:column;gap:0;--p:1;background:radial-gradient(circle at 50% 40%,rgba(120,110,95,.95) 0 58%,transparent 59%),conic-gradient(#ffd77a calc(var(--p)*360deg),rgba(40,28,18,.9) 0);border-color:#ff8a6a;animation:blink 1s infinite}
#bTrap{display:none;right:max(24px,calc(env(safe-area-inset-right) + 2px));bottom:max(140px,calc(env(safe-area-inset-bottom) + 140px));width:78px;height:78px;font-size:28px;flex-direction:column;gap:0;--p:1;background:radial-gradient(circle at 50% 40%,rgba(60,110,150,.95) 0 58%,transparent 59%),conic-gradient(#8fe0ff calc(var(--p)*360deg),rgba(40,28,18,.9) 0);border-color:#8fe0ff}
#bTrap.on{display:flex}#bTrap.cool{opacity:.6}#bTrap.ready{animation:blink 0.8s infinite;border-color:#fff}
#bTrap small{font-size:10px;font-weight:700}
#hud.lefty #bTrap{right:auto;left:max(24px,env(safe-area-inset-left))}
#hud.bridge #bRock{right:calc(max(22px,env(safe-area-inset-right)) + 96px)}#hud.lefty.bridge #bRock{right:auto;left:calc(max(22px,env(safe-area-inset-left)) + 96px)}
#bRock.on{display:flex}#bRock.cool{animation:none;opacity:.75}
#bRock small{font-size:10px;font-weight:700}
#hud.lefty #bRock{right:auto;left:max(22px,env(safe-area-inset-left))}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:136px;height:136px;border-radius:50%;border:2px solid rgba(226,169,59,.6);background:rgba(20,14,9,.35);pointer-events:auto;touch-action:none}
#hud.lefty #joy{left:auto;right:max(18px,env(safe-area-inset-right))}
#joyK{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(226,169,59,.8);box-shadow:0 2px 8px #000}
#bZoom.on{background:rgba(226,169,59,.55)}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid rgba(255,250,235,.85);box-shadow:0 0 3px #000}
#cross:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff}
#msg{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;width:90vw}
#msg.on{animation:pop 2.6s ease forwards}
#msgA{font-size:clamp(26px,5.5vw,40px);font-weight:900;color:var(--gold2);text-shadow:0 2px 0 #5a3412,0 3px 10px #000}
#msgB{font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}18%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);background:rgba(20,14,9,.94);border:1px solid var(--gold);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;max-width:86vw;text-align:center}
#toast.on{opacity:1}
#rotHint{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(20,14,9,.88);border:1px solid rgba(226,169,59,.6);border-radius:10px;padding:6px 12px;font-size:13px;display:none;pointer-events:none;z-index:20}
#rotHint.on{display:block}
#warn{position:fixed;left:50%;top:66px;transform:translateX(-50%);background:rgba(160,20,0,.88);border:2px solid #ff7a6a;color:#fff;font-weight:900;padding:8px 16px;border-radius:12px;display:none;z-index:20;pointer-events:none;font-size:16px;animation:blink .5s infinite}
#warn.on{display:block}
#gateWarn{position:absolute;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 58px));transform:translateX(-50%);background:rgba(170,25,10,.85);border:2px solid #ff8a7a;color:#fff;font-weight:900;padding:6px 14px;border-radius:12px;display:none;font-size:15px;animation:blink .7s infinite;white-space:nowrap}
#gateWarn.on{display:block}
#shopTabs{display:flex;gap:8px;margin-bottom:10px}#shopTabs button{flex:1;min-height:44px;border-radius:12px;background:var(--card2);border:1px solid #4a3a28;font-weight:800}#shopTabs button.on{background:var(--gold);color:#241605;border-color:var(--gold)}
.item{display:flex;gap:12px;align-items:center;background:rgba(33,23,15,.94);border:2px solid rgba(226,169,59,.3);border-radius:14px;padding:10px;margin-bottom:10px}
.item.sel{border-color:var(--gold)}
.item img,.item .emo{width:110px;height:64px;object-fit:contain;flex:none;background:radial-gradient(#3a2a1a,#1c140c);border-radius:10px}
.item .emo{display:flex;align-items:center;justify-content:center;font-size:36px}
.item .inf{flex:1;min-width:0}.item .inf b{color:var(--gold2);font-size:16px}.item .inf small{display:block;opacity:.85;font-size:12px;line-height:1.35;margin-top:2px}
.item .act{flex:none}.item .act .btn{padding:8px 12px;min-height:42px;font-size:14px}.btn.poor{opacity:.5}
.tag{display:inline-block;padding:6px 10px;border-radius:10px;background:rgba(95,207,127,.15);color:var(--ok);font-weight:800;font-size:13px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;margin-top:6px;font-size:11px;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:#3a2a1c;overflow:hidden;display:block}.bar i{display:block;height:100%;background:var(--gold)}
.pips{display:flex;gap:5px;margin-top:6px}.pips i{width:22px;height:7px;border-radius:4px;background:#4a3a28}.pips i.on{background:var(--gold)}

#ammo{position:absolute;right:max(140px,calc(env(safe-area-inset-right) + 140px));bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}

#ammo .am{width:54px;height:54px;border-radius:14px;border:2px solid rgba(226,169,59,.6);background:rgba(20,14,9,.7);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;touch-action:none}
#ammo .am small{font-size:11px;font-weight:800;color:var(--gold2);margin-top:2px}
#ammo .am.on{background:rgba(226,169,59,.55);border-color:#fff;transform:translateY(-4px)}#ammo .am.out{opacity:.35}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,20,10,.65) 100%);z-index:15}
#hurt.on{animation:hurt .6s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}
@keyframes blink{50%{opacity:.4}}
/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:30;padding:16px;touch-action:pan-y}
.ov.on{display:flex;animation:fade .2s}
.card{width:100%;max-width:470px;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#2a1d12,#1c140c);border:2px solid rgba(226,169,59,.75);border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}

<body>
<canvas id="gl"></canvas>

<div id="loading" class="on"><h1>ARROW<span>NEST</span></h1><div class="lb"><div id="loadBar"></div></div><div id="loadTxt" data-t="loading"></div></div>

<section class="screen" id="home">
  <div class="wrap">
    <div class="logo"><h1>ARROW<span>NEST</span></h1><div class="heb" dir="rtl">שומר השער</div><p data-t="tagline"></p><span class="cash">🪙 <span id="cashHome">0</span></span><span class="cash" id="starsHome"></span></div>
    <div class="modes">
      <button class="mode big" data-go="levels"><div class="ic">🏹</div><div><b data-t="play"></b><small data-t="playD"></small></div></button>
      <button class="mode" data-go="shop"><div class="ic">🛒</div><div><b data-t="shop"></b><small data-t="shopD"></small></div></button>
